<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clip Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bench: #2c2d30;
      --side: #252629;
      --rail: #1f2022;
      --field: #1a1b1d;
      --raise: #3a3b3f;
      --line: #414347;
      --ink: #ececea;
      --ink-2: #a6a8ac;
      --ink-3: #7b7d82;
      --tape: #f2c32b;
      --tape-hover: #ffd34d;
      --tape-ink: #1d1a10;
      --tape-wash: rgba(242, 195, 43, 0.26);
      --error: #ff7d6e;
      --thumb: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Archivo', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      background: var(--bench);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 0.75rem 1.25rem;
      background: var(--rail);
      border-bottom: 1px solid var(--line);
    }
    .wordmark {
      font-size: 1.0625rem;
      font-weight: 800;
      font-stretch: 125%;
      white-space: nowrap;
    }
    .source {
      display: flex;
      gap: 0.5rem;
      flex: 1;
      max-width: 820px;
    }
    .source .field { flex: 1; }

    .field {
      font: inherit;
      font-size: 0.9375rem;
      min-width: 0;
      background: var(--field);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 0.55rem 0.75rem;
    }
    .field::placeholder { color: var(--ink-3); }
    .field:focus { outline: none; border-color: var(--tape); }
    .field-sm { font-size: 0.875rem; padding: 0.45rem 0.65rem; }

    .btn {
      font: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      white-space: nowrap;
      background: var(--raise);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 0.5rem 0.85rem;
      cursor: pointer;
    }
    .btn:hover:not(:disabled) { background: #45474b; }
    .btn:focus-visible { outline: 2px solid var(--tape); outline-offset: 2px; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--tape); border-color: var(--tape); color: var(--tape-ink); }
    .btn-primary:hover:not(:disabled) { background: var(--tape-hover); }
    .btn-sm { font-size: 0.8125rem; padding: 0.3rem 0.6rem; }

    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
    }
    .editor {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .clip-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 1.25rem;
      min-height: 2.9rem;
    }
    .video-meta {
      align-items: baseline;
      gap: 0.75rem;
      min-width: 0;
    }
    #videoTitleDisplay {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #videoDurationDisplay {
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }
    .status-msg {
      font-size: 0.8125rem;
      color: var(--ink-2);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .video-viewport {
      background: #000;
      aspect-ratio: 16 / 9;
      max-height: 62vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      outline: none;
    }
    .placeholder-view {
      color: var(--ink-3);
      padding: 2rem;
      text-align: center;
    }

    .timeline {
      position: relative;
      height: 44px;
      margin: 1rem 1.25rem 0;
      user-select: none;
    }
    .timeline-lane {
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(var(--thumb) / 2);
      right: calc(var(--thumb) / 2);
      background-color: var(--rail);
      background-image: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px 10%);
      background-size: 100% 8px;
      background-repeat: no-repeat;
      background-position: bottom;
    }
    .timeline-range-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      background: var(--tape-wash);
      border-top: 2px solid var(--tape);
      border-bottom: 2px solid var(--tape);
    }
    .playhead-marker {
      position: absolute;
      top: -4px;
      bottom: -4px;
      width: 2px;
      margin-left: -1px;
      background: var(--ink);
    }
    .range-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      appearance: none;
      -webkit-appearance: none;
      pointer-events: none;
    }
    .range-input:focus { outline: none; }
    .range-input::-webkit-slider-runnable-track { height: 44px; background: transparent; }
    .range-input::-moz-range-track { background: transparent; }
    .range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      pointer-events: auto;
      width: var(--thumb);
      height: 44px;
      background: var(--tape);
      border: 0;
      cursor: ew-resize;
    }
    .range-input::-moz-range-thumb {
      pointer-events: auto;
      width: var(--thumb);
      height: 44px;
      background: var(--tape);
      border: 0;
      border-radius: 0;
      cursor: ew-resize;
    }
    #startSlider::-webkit-slider-thumb { border-radius: 3px 0 0 3px; }
    #startSlider::-moz-range-thumb { border-radius: 3px 0 0 3px; }
    #endSlider::-webkit-slider-thumb { border-radius: 0 3px 3px 0; }
    #endSlider::-moz-range-thumb { border-radius: 0 3px 3px 0; }
    .range-input:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--ink); outline-offset: 2px; }
    .range-input:focus-visible::-moz-range-thumb { outline: 2px solid var(--ink); outline-offset: 2px; }

    .readout {
      display: flex;
      gap: 2.5rem;
      padding: 1rem 1.25rem 0;
    }
    .readout-cell {
      display: flex;
      flex-direction: column;
    }
    .readout-label {
      font-size: 0.8125rem;
      color: var(--ink-3);
    }
    .timecode {
      font-size: 2rem;
      font-weight: 500;
      font-stretch: 80%;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .timecode-length { color: var(--tape); }

    .transport {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 1rem 1.25rem 1.25rem;
    }
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .sidebar {
      background: var(--side);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .tabs-nav {
      display: flex;
      gap: 1.5rem;
      padding: 0 1.25rem;
      border-bottom: 1px solid var(--line);
    }
    .tab-btn {
      font: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      background: none;
      color: var(--ink-2);
      border: 0;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      padding: 0.85rem 0 0.7rem;
      cursor: pointer;
    }
    .tab-btn:hover { color: var(--ink); }
    .tab-btn:focus-visible { outline: 2px solid var(--tape); outline-offset: 2px; }
    .tab-btn.active { color: var(--ink); border-bottom-color: var(--tape); }
    .tab-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1rem 1.25rem;
    }
    .analyze-row {
      display: flex;
      gap: 0.5rem;
    }
    .analyze-row .field { flex: 1; }
    .hint {
      font-size: 0.8125rem;
      color: var(--ink-3);
      margin-top: 0.4rem;
    }
    [hidden] { display: none !important; }

    .ai-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .ai-pair {
      display: flex;
      gap: 0.5rem;
    }
    .ai-field {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .ai-field .field { width: 100%; }
    .field-label {
      font-size: 0.8125rem;
      color: var(--ink-3);
    }
    select.field {
      color-scheme: dark;
      height: 2.3rem;
      cursor: pointer;
    }
    .ai-form .hint { margin-top: 0; }
    .ai-remember {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .check {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.875rem;
      color: var(--ink-2);
      cursor: pointer;
    }
    .check input { accent-color: var(--tape); width: 15px; height: 15px; }
    .check:has(input:disabled) { opacity: 0.45; cursor: not-allowed; }
    .export-group {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .ai-answered {
      font-size: 0.8125rem;
      color: var(--ink-2);
    }

    .video-platform {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--ink-2);
      white-space: nowrap;
    }
    .load-error {
      font-size: 0.875rem;
      color: var(--error);
      padding: 0 1.25rem 0.75rem;
    }

    .highlight-list { display: flex; flex-direction: column; }
    .highlight {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      padding: 0.9rem 0;
      border-top: 1px solid var(--line);
    }
    .highlight-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }
    .highlight-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .highlight-score {
      font-size: 0.8125rem;
      color: var(--ink-2);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .highlight-reason {
      font-size: 0.875rem;
      color: var(--ink-2);
    }
    .highlight-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.2rem;
    }
    .highlight-range {
      font-size: 0.9375rem;
      font-stretch: 87.5%;
      font-variant-numeric: tabular-nums;
    }

    .caption-list { display: flex; flex-direction: column; }
    .transcript-line {
      font: inherit;
      font-size: 0.9rem;
      text-align: left;
      display: flex;
      gap: 0.85rem;
      width: calc(100% + 1rem);
      margin: 0 -0.5rem;
      padding: 0.45rem 0.5rem;
      background: none;
      color: var(--ink-2);
      border: 0;
      border-radius: 3px;
      cursor: pointer;
    }
    .transcript-line:hover { background: #303135; color: var(--ink); }
    .transcript-line:focus-visible { outline: 2px solid var(--tape); outline-offset: -2px; color: var(--ink); }
    .transcript-time {
      min-width: 4.5em;
      color: var(--ink-3);
      font-stretch: 87.5%;
      font-variant-numeric: tabular-nums;
    }

    .empty {
      font-size: 0.875rem;
      color: var(--ink-3);
      padding: 1.5rem 0;
    }
    .empty-error { color: var(--error); }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--tape);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      vertical-align: -1px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 3s; }
    }

    @media (min-width: 1025px) {
      body { height: 100vh; }
      .workspace { min-height: 0; }
      .editor { overflow-y: auto; }
    }
    @media (max-width: 1024px) {
      .workspace { grid-template-columns: 1fr; }
      .sidebar { border-left: 0; border-top: 1px solid var(--line); }
      .tab-content { overflow-y: visible; }
    }
    @media (max-width: 640px) {
      .topbar { flex-wrap: wrap; gap: 0.75rem; padding: 0.75rem 1rem; }
      .source { flex-wrap: wrap; flex-basis: 100%; }
      .source .field { flex-basis: 100%; }
      .clip-meta, .load-error, .readout, .transport, .tabs-nav, .tab-content { padding-left: 1rem; padding-right: 1rem; }
      .timeline { margin-left: 1rem; margin-right: 1rem; }
      .readout { gap: 1.5rem; }
      .timecode { font-size: 1.5rem; }
      .transport .btn-primary { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="wordmark">Clip Studio</span>
    <div class="source">
      <input type="text" id="urlInput" class="field" placeholder="Paste a YouTube, Twitch or Kick link" aria-label="Video link">
      <button id="loadBtn" class="btn btn-primary">Load video</button>
      <button id="fetchCcTopBtn" class="btn">Get captions</button>
    </div>
  </header>

  <main class="workspace">
    <section class="editor">
      <div class="clip-meta">
        <div id="videoMetaHeader" class="video-meta" style="display: none;">
          <span id="videoTitleDisplay"></span>
          <span id="videoPlatformDisplay" class="video-platform"></span>
          <span id="videoDurationDisplay">00:00</span>
        </div>
        <div id="loadStatus" class="status-msg">Ready</div>
      </div>
      <p id="loadError" class="load-error" role="alert" hidden></p>

      <div class="video-viewport" id="viewport">
        <div class="placeholder-view" id="placeholderView">
          <p>Paste a YouTube, Twitch or Kick link above to start clipping.</p>
        </div>
        <video id="videoPlayer" controls style="display: none;"></video>
      </div>

      <div class="timeline" id="timelineContainer">
        <div class="timeline-lane">
          <div class="timeline-range-fill" id="rangeFill"></div>
          <div class="playhead-marker" id="playheadMarker"></div>
        </div>
        <input type="range" id="startSlider" class="range-input" min="0" max="100" step="0.1" value="0" aria-label="In point">
        <input type="range" id="endSlider" class="range-input" min="0" max="100" step="0.1" value="100" aria-label="Out point">
      </div>

      <div class="readout">
        <div class="readout-cell">
          <span class="readout-label">In</span>
          <span id="startTimeVal" class="timecode">00:00.0</span>
        </div>
        <div class="readout-cell">
          <span class="readout-label">Out</span>
          <span id="endTimeVal" class="timecode">00:00.0</span>
        </div>
        <div class="readout-cell">
          <span class="readout-label">Length</span>
          <span id="clipDurationPill" class="timecode timecode-length">00:00.0</span>
        </div>
      </div>

      <div class="transport">
        <div class="button-group">
          <button id="setStartBtn" class="btn" title="Move the in point to the playhead">Set in</button>
          <button id="setEndBtn" class="btn" title="Move the out point to the playhead">Set out</button>
          <button id="stepBackBtn" class="btn" aria-label="Step back 0.1 seconds">−0.1s</button>
          <button id="stepForwardBtn" class="btn" aria-label="Step forward 0.1 seconds">+0.1s</button>
          <button id="previewClipBtn" class="btn">Play range</button>
          <button id="resetRangeBtn" class="btn">Reset</button>
        </div>
        <div class="export-group">
          <button id="exportBtn" class="btn btn-primary" disabled>Export clip</button>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="tabs-nav">
        <button class="tab-btn active" id="tabHighlightsBtn" onclick="switchTab('highlights')">Highlights</button>
        <button class="tab-btn" id="tabCaptionsBtn" onclick="switchTab('captions')">Transcript</button>
      </div>

      <div id="highlightsTab" class="tab-content">
        <div class="ai-form">
          <div class="ai-pair">
            <label class="ai-field">
              <span class="field-label">AI provider</span>
              <select id="aiProviderSelect" class="field field-sm">
                <option value="auto">Automatic</option>
              </select>
            </label>
            <label class="ai-field" id="aiModelRow" hidden>
              <span class="field-label">Model</span>
              <input type="text" id="aiModelInput" class="field field-sm" autocomplete="off" spellcheck="false">
            </label>
          </div>
          <div class="ai-field" id="aiKeyRow" hidden>
            <label class="field-label" for="geminiApiKey">API key</label>
            <input type="password" id="geminiApiKey" class="field field-sm" autocomplete="off" placeholder="API key">
          </div>
          <label class="ai-field" id="aiBaseUrlRow" hidden>
            <span class="field-label">Base URL</span>
            <input type="url" id="aiBaseUrlInput" class="field field-sm" autocomplete="off" spellcheck="false">
          </label>
          <div class="ai-remember" id="aiRememberRow" hidden>
            <label class="check"><input type="checkbox" id="aiRememberInput" checked> Remember on this computer</label>
            <button type="button" id="aiForgetBtn" class="btn btn-sm" hidden>Forget saved settings</button>
          </div>
          <p id="aiProviderHint" class="hint"></p>
          <div class="ai-field">
            <label class="field-label" for="aiQueryInput">Look for</label>
            <div class="analyze-row">
              <input type="text" id="aiQueryInput" class="field field-sm" placeholder="e.g. the moment they talk about pricing">
              <button id="aiAnalyzeBtn" class="btn btn-sm" disabled>Find moments</button>
            </div>
          </div>
        </div>

        <p id="aiAnswered" class="ai-answered" hidden></p>
        <div id="highlightsList" class="highlight-list">
          <p class="empty">Load a video to find moments worth clipping.</p>
        </div>
      </div>

      <div id="captionsTab" class="tab-content" style="display: none;">
        <input type="text" id="searchCaptionsInput" class="field field-sm" placeholder="Search transcript" aria-label="Search transcript">
        <div id="captionsList" class="caption-list">
          <p class="empty">The transcript appears here after you load a video.</p>
        </div>
      </div>
    </aside>
  </main>

  <script>
    let currentVideoId = null;
    let videoDuration = 0;
    let clipStart = 0;
    let clipEnd = 0;
    let allCaptions = [];

    const videoPlayer = document.getElementById('videoPlayer');
    const placeholderView = document.getElementById('placeholderView');
    const urlInput = document.getElementById('urlInput');
    const loadBtn = document.getElementById('loadBtn');
    const fetchCcTopBtn = document.getElementById('fetchCcTopBtn');
    const loadStatus = document.getElementById('loadStatus');
    const startSlider = document.getElementById('startSlider');
    const endSlider = document.getElementById('endSlider');
    const rangeFill = document.getElementById('rangeFill');
    const playheadMarker = document.getElementById('playheadMarker');
    const startTimeVal = document.getElementById('startTimeVal');
    const endTimeVal = document.getElementById('endTimeVal');
    const clipDurationPill = document.getElementById('clipDurationPill');
    const setStartBtn = document.getElementById('setStartBtn');
    const setEndBtn = document.getElementById('setEndBtn');
    const stepBackBtn = document.getElementById('stepBackBtn');
    const stepForwardBtn = document.getElementById('stepForwardBtn');
    const previewClipBtn = document.getElementById('previewClipBtn');
    const resetRangeBtn = document.getElementById('resetRangeBtn');
    const exportBtn = document.getElementById('exportBtn');
    const aiAnalyzeBtn = document.getElementById('aiAnalyzeBtn');
    const highlightsList = document.getElementById('highlightsList');
    const captionsList = document.getElementById('captionsList');
    const searchCaptionsInput = document.getElementById('searchCaptionsInput');
    const geminiApiKey = document.getElementById('geminiApiKey');
    const aiProviderSelect = document.getElementById('aiProviderSelect');
    const aiModelInput = document.getElementById('aiModelInput');
    const aiBaseUrlInput = document.getElementById('aiBaseUrlInput');
    const aiQueryInput = document.getElementById('aiQueryInput');
    const aiProviderHint = document.getElementById('aiProviderHint');
    const aiRememberRow = document.getElementById('aiRememberRow');
    const aiRememberInput = document.getElementById('aiRememberInput');
    const aiForgetBtn = document.getElementById('aiForgetBtn');
    const aiAnswered = document.getElementById('aiAnswered');
    const loadError = document.getElementById('loadError');

    const PLATFORM_LABELS = { youtube: 'YouTube', twitch: 'Twitch', kick: 'Kick' };
    const NO_SUBTITLES = 'This video has no subtitles, so the AI cannot search it. You can still trim the range by hand.';
    const AI_PREFS_KEY = 'clipStudio.ai';

    let aiProviders = new Map();
    let aiAuto = null;
    let aiPrefs = readAiPrefs();

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) seconds = 0;
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      const ms = Math.floor((seconds % 1) * 10);
      const pad = (n) => String(n).padStart(2, '0');
      if (h > 0) {
        return `${pad(h)}:${pad(m)}:${pad(s)}.${ms}`;
      }
      return `${pad(m)}:${pad(s)}.${ms}`;
    }

    function switchTab(tab) {
      document.getElementById('highlightsTab').style.display = tab === 'highlights' ? 'flex' : 'none';
      document.getElementById('captionsTab').style.display = tab === 'captions' ? 'flex' : 'none';
      document.getElementById('tabHighlightsBtn').classList.toggle('active', tab === 'highlights');
      document.getElementById('tabCaptionsBtn').classList.toggle('active', tab === 'captions');
    }

    function setStatus(text, loading = false) {
      if (loading) {
        loadStatus.innerHTML = `<span class="spinner"></span> <span>${text}</span>`;
      } else {
        loadStatus.textContent = text;
      }
    }

    async function loadVideo() {
      const url = urlInput.value.trim();
      if (!url) {
        showLoadError('Paste a YouTube, Twitch or Kick link first.');
        return;
      }

      showLoadError(null);
      setStatus('Fetching video info…', true);
      loadBtn.disabled = true;

      try {
        const info = await sendJson('POST', '/api/info', { url }, 'Could not read this link');
        currentVideoId = info.video_id;
        exportBtn.disabled = true;
        showMessage(captionsList, 'Fetching subtitles…');
        showMessage(highlightsList, 'Fetching subtitles…');
        videoDuration = info.duration || 100;
        allCaptions = [];
        aiAnswered.hidden = true;
        updateFindMomentsButton();

        document.getElementById('videoMetaHeader').style.display = 'flex';
        document.getElementById('videoTitleDisplay').textContent = info.title;
        document.getElementById('videoPlatformDisplay').textContent = PLATFORM_LABELS[info.platform] || info.platform || '';
        document.getElementById('videoDurationDisplay').textContent = info.duration ? formatTime(info.duration) : '';

        setStatus('Downloading video…', true);
        const dlData = await sendJson('POST', '/api/download', { url }, 'Download failed');

        placeholderView.style.display = 'none';
        videoPlayer.style.display = 'block';
        videoPlayer.src = dlData.stream_url;
        videoPlayer.load();

        videoPlayer.onloadedmetadata = () => {
          videoDuration = videoPlayer.duration || videoDuration;
          document.getElementById('videoDurationDisplay').textContent = formatTime(videoDuration);
          initSliders();
          exportBtn.disabled = false;
        };

        fetchCaptions();
      } catch (err) {
        console.error(err);
        setStatus('Link not loaded');
        showLoadError(err.message);
      } finally {
        loadBtn.disabled = false;
      }
    }

    function initSliders() {
      startSlider.max = videoDuration;
      endSlider.max = videoDuration;
      startSlider.value = 0;
      endSlider.value = Math.min(30, videoDuration);
      clipStart = 0;
      clipEnd = parseFloat(endSlider.value);
      updateTimelineUI();
    }

    function updateTimelineUI() {
      clipStart = Math.min(parseFloat(startSlider.value), parseFloat(endSlider.value) - 0.5);
      clipEnd = Math.max(parseFloat(endSlider.value), clipStart + 0.5);

      startSlider.value = clipStart;
      endSlider.value = clipEnd;
      renderRange();
    }

    function renderRange() {
      startTimeVal.textContent = formatTime(clipStart);
      endTimeVal.textContent = formatTime(clipEnd);
      const dur = Math.max(0, clipEnd - clipStart);
      clipDurationPill.textContent = formatTime(dur);

      const startPercent = (clipStart / videoDuration) * 100;
      const endPercent = (clipEnd / videoDuration) * 100;
      rangeFill.style.left = `${startPercent}%`;
      rangeFill.style.width = `${Math.max(0, endPercent - startPercent)}%`;
    }

    startSlider.addEventListener('input', () => {
      if (parseFloat(startSlider.value) >= parseFloat(endSlider.value)) {
        startSlider.value = parseFloat(endSlider.value) - 0.5;
      }
      updateTimelineUI();
      videoPlayer.currentTime = clipStart;
    });

    endSlider.addEventListener('input', () => {
      if (parseFloat(endSlider.value) <= parseFloat(startSlider.value)) {
        endSlider.value = parseFloat(startSlider.value) + 0.5;
      }
      updateTimelineUI();
      videoPlayer.currentTime = clipEnd;
    });

    videoPlayer.addEventListener('timeupdate', () => {
      if (videoDuration > 0) {
        const percent = (videoPlayer.currentTime / videoDuration) * 100;
        playheadMarker.style.left = `${percent}%`;
      }
    });

    setStartBtn.addEventListener('click', () => {
      const cur = videoPlayer.currentTime;
      if (cur < clipEnd) {
        startSlider.value = cur;
        updateTimelineUI();
      }
    });

    setEndBtn.addEventListener('click', () => {
      const cur = videoPlayer.currentTime;
      if (cur > clipStart) {
        endSlider.value = cur;
        updateTimelineUI();
      }
    });

    stepBackBtn.addEventListener('click', () => {
      videoPlayer.currentTime = Math.max(0, videoPlayer.currentTime - 0.1);
    });

    stepForwardBtn.addEventListener('click', () => {
      videoPlayer.currentTime = Math.min(videoDuration, videoPlayer.currentTime + 0.1);
    });

    previewClipBtn.addEventListener('click', () => {
      videoPlayer.currentTime = clipStart;
      videoPlayer.play();
      const checkLoop = () => {
        if (videoPlayer.currentTime >= clipEnd) {
          videoPlayer.pause();
          videoPlayer.removeEventListener('timeupdate', checkLoop);
        }
      };
      videoPlayer.addEventListener('timeupdate', checkLoop);
    });

    resetRangeBtn.addEventListener('click', () => {
      initSliders();
    });

    async function fetchCaptions() {
      const url = urlInput.value.trim();
      if (!url) return;

      setStatus('Fetching subtitles…', true);
      try {
        const data = await sendJson('POST', '/api/captions', { url }, 'Could not fetch subtitles');
        allCaptions = data.captions || [];
        updateFindMomentsButton();
        if (allCaptions.length === 0) {
          showMessage(captionsList, NO_SUBTITLES);
          showMessage(highlightsList, NO_SUBTITLES);
          setStatus('No subtitles for this video');
          return;
        }
        renderCaptions(allCaptions);
        showMessage(highlightsList, `${countOf(allCaptions.length, 'subtitle line')} ready. Say what to look for, or leave it blank, and choose Find moments.`);
        setStatus(`Loaded ${countOf(allCaptions.length, 'subtitle line')}`);
      } catch (err) {
        console.warn('Subtitles unavailable:', err);
        allCaptions = [];
        updateFindMomentsButton();
        showMessage(captionsList, `Subtitles could not be loaded. ${err.message}`, true);
        showMessage(highlightsList, 'Finding moments needs subtitles. You can still trim the range by hand.');
        setStatus('Subtitles failed');
      }
    }

    function renderCaptions(segments) {
      if (!segments || segments.length === 0) {
        showMessage(captionsList, allCaptions.length ? 'No lines match your search.' : NO_SUBTITLES);
        return;
      }
      captionsList.innerHTML = segments.map((s, idx) => `
        <button class="transcript-line" onclick="seekVideo(${s.start})">
          <span class="transcript-time">${formatTime(s.start)}</span>
          <span>${escapeHtml(s.text)}</span>
        </button>
      `).join('');
    }

    function seekVideo(time) {
      videoPlayer.currentTime = time;
      videoPlayer.play();
    }

    searchCaptionsInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allCaptions.filter(s => s.text.toLowerCase().includes(term));
      renderCaptions(filtered);
    });

    async function triggerAiHighlights() {
      if (allCaptions.length === 0) return;

      setStatus('Finding moments…', true);
      aiAnalyzeBtn.disabled = true;
      aiAnswered.hidden = true;
      highlightsList.innerHTML = `<p class="empty"><span class="spinner"></span> Reading the transcript…</p>`;

      try {
        await rememberAiSettings();
        const data = await sendJson('POST', '/api/ai-highlights', aiRequestBody(), 'Could not find moments');
        const highlights = data.highlights || [];
        renderHighlights(highlights);
        aiAnswered.textContent = `Answered by ${providerLabel(data.provider)}`;
        aiAnswered.hidden = false;
        setStatus(`Found ${countOf(highlights.length, 'moment')}`);
      } catch (err) {
        console.error(err);
        showMessage(highlightsList, err.message, true);
        setStatus('Finding moments failed');
      } finally {
        updateFindMomentsButton();
      }
    }

    function aiRequestBody() {
      const body = { captions: allCaptions, provider: aiProviderSelect.value };
      const optional = [
        ['api_key', geminiApiKey, 'aiKeyRow'],
        ['model', aiModelInput, 'aiModelRow'],
        ['base_url', aiBaseUrlInput, 'aiBaseUrlRow'],
        ['query', aiQueryInput, null],
      ];
      for (const [name, input, rowId] of optional) {
        const value = input.value.trim();
        if (value && !(rowId && document.getElementById(rowId).hidden)) body[name] = value;
      }
      return body;
    }

    function updateFindMomentsButton() {
      aiAnalyzeBtn.disabled = allCaptions.length === 0;
    }

    function providerLabel(id) {
      return aiProviders.get(id)?.label || id;
    }

    async function loadAiProviders() {
      try {
        const res = await fetch('/api/ai/providers');
        if (!res.ok) throw new Error(await errorDetail(res, 'Could not load AI providers'));
        applyAiProviders(await res.json());
      } catch (err) {
        console.warn(err);
        applyAiProviders({ providers: [], auto: null });
        aiProviderHint.textContent = 'AI providers could not be loaded. Automatic is the only choice.';
      }
    }

    function applyAiProviders(data) {
      const selected = aiProviderSelect.value === 'auto' ? aiPrefs.provider : aiProviderSelect.value;
      aiProviders = new Map(data.providers.map(p => [p.id, p]));
      aiAuto = data.auto;
      aiProviderSelect.replaceChildren(new Option(aiAuto ? `Automatic (${providerLabel(aiAuto)})` : 'Automatic', 'auto'));
      for (const p of aiProviders.values()) aiProviderSelect.add(new Option(p.label, p.id));
      if (aiProviders.has(selected)) aiProviderSelect.value = selected;
      renderAiFields();
    }

    async function rememberAiSettings() {
      const p = aiProviders.get(aiProviderSelect.value);
      if (!p?.accepts_key || !aiRememberInput.checked) return;
      const settings = {
        api_key: geminiApiKey.value.trim(),
        model: aiModelInput.value.trim(),
        base_url: p.uses_base_url ? aiBaseUrlInput.value.trim() : '',
      };
      if (!settings.api_key && !settings.model && !settings.base_url) return;
      applyAiProviders(await sendJson('PUT', `/api/ai/providers/${p.id}`, settings, 'Could not save these settings'));
    }

    aiForgetBtn.addEventListener('click', async () => {
      const id = aiProviderSelect.value;
      try {
        applyAiProviders(await sendJson('DELETE', `/api/ai/providers/${id}`, null, 'Could not forget these settings'));
        aiPrefs.models[id] = '';
        aiPrefs.baseUrls[id] = '';
        saveAiPrefs();
        renderAiFields();
        aiProviderHint.textContent = `Forgot the saved ${providerLabel(id)} settings.`;
      } catch (err) {
        aiProviderHint.textContent = err.message;
      }
    });

    function renderAiFields() {
      const id = aiProviderSelect.value;
      const p = aiProviders.get(id);
      document.getElementById('aiModelRow').hidden = !p;
      document.getElementById('aiKeyRow').hidden = !p?.accepts_key;
      aiRememberRow.hidden = !p?.accepts_key;
      aiForgetBtn.hidden = !p?.has_saved_settings;
      document.getElementById('aiBaseUrlRow').hidden = !p?.uses_base_url;
      geminiApiKey.value = '';
      if (p) {
        geminiApiKey.placeholder = p.saved_key_hint ? `Saved key ${p.saved_key_hint}`
          : p.has_server_key ? 'Uses the server key' : (p.needs_key ? 'API key' : 'API key (optional)');
        aiModelInput.placeholder = p.default_model || 'Model name';
        aiModelInput.value = aiPrefs.models[id] || '';
        aiBaseUrlInput.placeholder = p.default_base_url || 'Base URL';
        aiBaseUrlInput.value = aiPrefs.baseUrls[id] || '';
      }
      renderAiHint();
    }

    function renderAiHint() {
      const p = aiProviders.get(aiProviderSelect.value);
      if (!p && aiAuto) {
        aiProviderHint.textContent = `Automatic uses ${providerLabel(aiAuto)} with the server's settings.`;
      } else if (p?.accepts_key) {
        aiProviderHint.textContent = aiRememberInput.checked
          ? 'Saved on this computer when you choose Find moments, so you only enter it once.'
          : 'Sent with this request only, never saved.';
      } else if (p) {
        aiProviderHint.textContent = '';
      }
    }

    function readAiPrefs() {
      try {
        const saved = JSON.parse(localStorage.getItem(AI_PREFS_KEY)) || {};
        return { provider: saved.provider, models: saved.models || {}, baseUrls: saved.baseUrls || {} };
      } catch {
        return { provider: undefined, models: {}, baseUrls: {} };
      }
    }

    function saveAiPrefs() {
      try {
        localStorage.setItem(AI_PREFS_KEY, JSON.stringify(aiPrefs));
      } catch {}
    }

    aiProviderSelect.addEventListener('change', () => {
      aiPrefs.provider = aiProviderSelect.value;
      saveAiPrefs();
      renderAiFields();
    });
    aiModelInput.addEventListener('input', () => {
      aiPrefs.models[aiProviderSelect.value] = aiModelInput.value.trim();
      saveAiPrefs();
    });
    aiBaseUrlInput.addEventListener('input', () => {
      aiPrefs.baseUrls[aiProviderSelect.value] = aiBaseUrlInput.value.trim();
      saveAiPrefs();
    });
    aiRememberInput.addEventListener('change', renderAiHint);
    aiQueryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !aiAnalyzeBtn.disabled) triggerAiHighlights();
    });

    function renderHighlights(highlights) {
      if (!highlights || highlights.length === 0) {
        showMessage(highlightsList, 'No moments found in this transcript.');
        return;
      }

      highlightsList.innerHTML = highlights.map(h => `
        <article class="highlight">
          <div class="highlight-head">
            <h3 class="highlight-title">${escapeHtml(h.title)}</h3>
            <span class="highlight-score" title="Highlight score">${Math.round(h.score * 100)}%</span>
          </div>
          <p class="highlight-reason">${escapeHtml(h.reason)}</p>
          <div class="highlight-foot">
            <span class="highlight-range">${formatTime(h.start)}–${formatTime(h.end)}</span>
            <button class="btn btn-sm" onclick="applyClipRange(${h.start}, ${h.end})">Use this range</button>
          </div>
        </article>
      `).join('');
    }

    function applyClipRange(start, end) {
      startSlider.value = start;
      endSlider.value = end;
      // Sliders snap to their 0.1s step; the AI's timestamps must reach export unrounded.
      clipStart = start;
      clipEnd = end;
      renderRange();
      videoPlayer.currentTime = start;
      videoPlayer.play();
    }

    async function exportClip() {
      if (!currentVideoId) {
        alert('Load a video before exporting.');
        return;
      }

      exportBtn.disabled = true;
      const body = { video_id: currentVideoId, start_time: clipStart, end_time: clipEnd, captions: allCaptions };
      setStatus('Exporting clip…', true);

      try {
        const data = await sendJson('POST', '/api/clip', body, 'Export failed');
        setStatus('Clip exported');

        const a = document.createElement('a');
        a.href = data.download_url;
        a.download = data.file_name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (err) {
        console.error(err);
        setStatus('Export failed: ' + err.message);
        alert(err.message);
      } finally {
        exportBtn.disabled = false;
      }
    }

    async function sendJson(method, path, body, fallbackMessage) {
      const res = await fetch(path, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: body === null ? undefined : JSON.stringify(body)
      });
      if (!res.ok) throw new Error(await errorDetail(res, fallbackMessage));
      return res.json();
    }

    // FastAPI sends `detail` as a string for HTTPException but as a list of objects for 422s.
    async function errorDetail(res, fallbackMessage) {
      try {
        const { detail } = await res.json();
        if (typeof detail === 'string' && detail) return detail;
      } catch {}
      return fallbackMessage;
    }

    function countOf(n, noun) {
      return `${n} ${noun}${n === 1 ? '' : 's'}`;
    }

    function showMessage(container, text, isError = false) {
      const p = document.createElement('p');
      p.className = isError ? 'empty empty-error' : 'empty';
      p.textContent = text;
      container.replaceChildren(p);
    }

    function showLoadError(text) {
      loadError.textContent = text || '';
      loadError.hidden = !text;
      urlInput.setAttribute('aria-invalid', text ? 'true' : 'false');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadBtn.addEventListener('click', loadVideo);
    fetchCcTopBtn.addEventListener('click', fetchCaptions);
    aiAnalyzeBtn.addEventListener('click', triggerAiHighlights);
    exportBtn.addEventListener('click', exportClip);

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadVideo();
    });

    loadAiProviders();
  </script>
</body>
</html>
