<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline · Clip Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/pipeline.css">
  <script type="module" src="/js/pipeline.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="wordmark">Clip Studio</span>
    <nav class="pages" data-nav aria-label="Pages"></nav>
  </header>

  <main class="workspace">
    <section class="pane runs-pane" aria-labelledby="runsHeading">
      <div class="pane-head">
        <div class="pane-head-title">
          <h1 id="runsHeading" class="pane-title">Runs</h1>
          <button type="button" id="clearRunsBtn" class="btn btn-sm" hidden>Clear finished</button>
        </div>
        <p id="aiChoice" class="hint"></p>
      </div>
      <p id="pageError" class="pane-error" role="alert" hidden></p>
      <div id="runsList" class="run-list">
        <p class="empty">Loading runs…</p>
      </div>
    </section>

    <aside class="sidebar">
      <section class="pane clips-pane" aria-labelledby="clipsHeading">
        <div class="pane-head-title">
          <h2 id="clipsHeading" class="pane-title">Clips</h2>
          <button type="button" id="clearClipsBtn" class="btn btn-sm btn-danger" hidden>Delete all</button>
        </div>
        <div id="clipsList" class="clip-list">
          <p class="empty">Loading clips…</p>
        </div>
      </section>
    </aside>
  </main>
</body>
</html>
